<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>此刻 · 雨窗调色室</title><style>
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;color:#304735;background:#f4f6ef;font:13px/1.6 -apple-system,'PingFang SC',sans-serif}button,input,select{font:inherit}button,a.button{min-height:40px;padding:8px 13px;border:1px solid #ced8c4;border-radius:8px;background:#fcfdf8;color:#42623c;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}button:hover,a.button:hover{background:#e9f0df}button.primary{background:#476c41;color:#fff;border-color:#476c41}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid #678b51;outline-offset:3px}header{height:67px;padding:12px 23px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #dbe2d3;background:#fbfcf7;gap:12px}header div{display:flex;align-items:baseline;gap:16px}h1{font:24px/1.3 'Songti SC','STSong',serif;margin:0;letter-spacing:2px}small{color:#7a8872}main{display:grid;grid-template-columns:minmax(0,1fr) 326px;height:calc(100dvh - 67px)}.view{min-width:0;display:flex;flex-direction:column;padding:18px;gap:12px}.canvas-wrap{position:relative;flex:1;min-height:220px;overflow:hidden;border:1px solid #dbe3d2;border-radius:13px;background:#fbfcf7;box-shadow:0 12px 30px #465d3e09}.landscape{position:absolute;inset:0;background:url('../../public/assets/r8/app-background-desktop.png') center bottom/cover;opacity:.78;mask-image:linear-gradient(transparent 18%,#000 86%)}.bamboo{position:absolute;right:-1%;top:-3%;width:185px;height:300px;object-fit:contain;opacity:.22;pointer-events:none}.glass{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 40%,#e9f2d532,transparent 66%)}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.brand{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);width:144px;height:144px;display:flex;align-items:center;justify-content:center;border:1px solid #9fb68d55;border-radius:50%;font:40px 'Songti SC','STSong',serif;letter-spacing:5px;color:#395c38;text-shadow:0 0 18px #fbfcf7;pointer-events:none}.brand span{position:absolute;top:102px;font:12px 'Songti SC',serif;border:1px solid #9fb68d77;letter-spacing:0;padding:0 3px;color:#839972}.caption{position:absolute;bottom:22px;left:26px;color:#7a9069;font:14px 'Songti SC',serif;letter-spacing:3px;pointer-events:none}.corner{position:absolute;top:15px;left:19px;font-size:11px;letter-spacing:1px;color:#87937d;pointer-events:none}.view-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.stats{margin-left:auto;font-size:11px;color:#718267;font-variant-numeric:tabular-nums}.panel{background:#fafbf6;border-left:1px solid #dbe2d3;overflow:auto;padding:20px 22px 28px}.panel h2{font:20px 'Songti SC',serif;margin:0 0 5px}.intro{font-size:11px;color:#7a8872;margin:0 0 14px}.presets{display:grid;grid-template-columns:repeat(2,1fr);gap:6px;margin-bottom:18px}.presets button{font-size:12px;min-height:35px;padding:5px}.presets button.selected{background:#e6eedc;border-color:#9db589;color:#36582e}.field{margin-bottom:11px}.field label{display:flex;align-items:center;justify-content:space-between;gap:8px}.field .value{display:flex;align-items:center;color:#77876c;font-size:11px;gap:5px}.field input[type=number]{width:56px;border:1px solid #d4dfca;border-radius:5px;background:#fff;color:#3b5734;padding:3px 4px;text-align:right;min-height:27px}input[type=range]{display:block;width:100%;height:20px;margin:3px 0;accent-color:#6f9357;cursor:pointer}.divider{border-top:1px solid #dce4d4;margin:17px 0 13px}.check{display:flex;align-items:center;gap:8px;margin:8px 0;min-height:28px;font-size:12px}.check input{accent-color:#6f9357;width:15px;height:15px}.help{color:#7a8872;font-size:11px;margin:6px 0 11px}details summary{cursor:pointer;font-size:12px;min-height:30px;color:#547248}.export{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}code{font:11px/1.5 monospace}#seed{width:100%;padding:7px;background:#fff;border:1px solid #d4dfca;border-radius:5px;margin:6px 0;font-variant-numeric:tabular-nums}#message{font-size:11px;color:#587949;min-height:34px;overflow-wrap:anywhere;margin:5px 0}.phone .canvas-wrap{width:min(100%,390px);height:100%;max-height:844px;flex:1;align-self:center}.phone .landscape{background-image:url('../../public/assets/r8/app-background-mobile.png')}.phone .bamboo{width:130px;height:210px}.phone .brand{width:124px;height:124px;font-size:35px}.phone .brand span{top:91px}.phone .caption{font-size:12px;left:20px}.phone .corner{font-size:10px}.phone .canvas-wrap{border-radius:24px}.view.phone{background:#edf1e6}.ribbon-example{margin-top:13px;border-top:1px solid #dbe3d2;padding-top:12px;font-size:11px;color:#7b8873}@media(max-width:760px){header{height:61px;padding:12px 16px}header small{display:none}h1{font-size:21px}header a.button{padding:5px 9px;font-size:12px}main{height:auto;grid-template-columns:1fr}.view{height:72dvh;min-height:400px;padding:12px}.panel{border-left:0;border-top:1px solid #dbe2d3;padding:20px}.controls-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}.landscape{background-image:url('../../public/assets/r8/app-background-mobile.png')}.stats{flex-basis:100%;margin:0}.presets{grid-template-columns:repeat(4,1fr)}.bamboo{width:130px;height:210px}.brand{width:124px;height:124px;font-size:35px}.brand span{top:91px}}
</style></head><body><header><div><h1>一窗青雨</h1><small>持续雨景 · 水膜与折光 · R9.4-F1 · 已确认参数</small></div><a class="button" href="guide.html">开屏评审 →</a><a class="button" href="rain-settings.html">产品设置 →</a></header><main><section class="view" id="view"><div class="canvas-wrap"><div class="landscape"></div><div class="glass"></div><img class="bamboo" src="../../public/assets/r8/bamboo-edge.png" alt=""><div class="brand" id="brand">此刻<span>此</span></div><canvas id="rain" aria-label="可调节的连续雨窗动画"></canvas><span class="corner">山水在后 · 雨在窗前</span><span class="caption">雨落有声，思绪有处。</span></div><div class="view-bar"><button id="pause">暂停雨景</button><button id="random">换一场雨</button><button id="device">手机构图</button><span class="stats" id="stats"></span></div></section><aside class="panel"><h2>雨势，由你来定。</h2><p class="intro">调节后，新落下的雨点采用新参数。已有水痕自然留存，不清场。</p><div class="presets"><button data-preset="confirmed" class="selected">已确认 · 默认</button><button data-preset="drizzle">细雨 · 常驻</button><button data-preset="ribbon">水痕 · 特写</button><button data-preset="dense">密雨 · 对照</button></div><div class="controls-grid" id="controls"></div><label class="check"><input id="protect" type="checkbox">让滑落水珠避开品牌中央</label><label class="check"><input id="show-brand" type="checkbox" checked>展示品牌</label><p class="help">拖尾比例是每次撞击后会滑落的概率，0% 全部停留，100% 全部滑落。少量雨点时不保证整场比例刚好相等。</p><div class="divider"></div><div class="export"><button id="clear">清空玻璃</button><button id="reset">恢复确认参数</button></div><details><summary>随机样本与开发配置</summary><label for="seed">样本编号（整数）</label><input id="seed" type="number" min="0" max="4294967295" step="1"><button id="reproduce">重播此样本</button><div class="export"><button id="copy">复制参数</button><button id="download">下载 JSON</button><a class="button" id="opening" href="index.html?manual=1" target="_blank">带入完整开屏 ↗</a></div><p class="help">同一配置、样本编号与画布尺寸可复现雨势；画面只用于设计评审。配置自动保存在本机。</p></details><p id="message" role="status"></p><div class="ribbon-example">滑落珠撞击后迅速起滑，留下有宽度的湿痕。新湿痕厚，旧湿痕逐渐收窄；边缘高光断续出现，背景通过水珠与水膜产生局部放大和轻微偏移。</div></aside></main><script src="rain-engine.js"></script><script>
(()=>{'use strict';const q=s=>document.querySelector(s),fields=[['slideDelay','撞击后起滑',0,250,5,'ms'],['slideLength','滑落距离',60,400,5,'px'],['density','雨水密度',0,10,.1,'滴/s'],['trailPercent','产生拖尾',0,100,1,'%'],['dropSize','水珠半径',2,14,.5,'px'],['trailWidth','水膜宽度',2,22,.5,'px'],['speed','滑落速度',15,180,1,'px/s'],['bend','路径偏折',0,100,1,'%'],['splash','飞溅小珠',0,10,1,'颗'],['trailLife','湿痕保留',1,18,.5,'s'],['beadLife','停留珠寿命',2,25,.5,'s'],['contrast','折光强度',20,140,1,'%']];
const presets={confirmed:{...GlassRain.defaults},drizzle:{...GlassRain.defaults,density:3,trailPercent:25,dropSize:4.5,trailWidth:5.5,speed:55,trailLife:8,beadLife:12,contrast:80},ribbon:{...GlassRain.defaults,density:2.2,trailPercent:80,dropSize:8,trailWidth:12,speed:85,bend:35,trailLife:4,contrast:120},dense:{...GlassRain.defaults,density:7,trailPercent:60,dropSize:5,trailWidth:8,speed:105,trailLife:5,beadLife:7,contrast:85}};
let config={...presets.confirmed};try{const saved=JSON.parse(localStorage.getItem('now.rain.r9.4.f1'));if(saved)config=GlassRain.validate(saved)}catch{}
const params=new URLSearchParams(location.search);try{if(params.has('config'))config=GlassRain.validate(JSON.parse(params.get('config')))}catch{}
let seed=params.has('seed')?Number(params.get('seed'))>>>0:GlassRain.freshSeed();const rain=new GlassRain(q('#rain'),config,seed);q('#seed').value=seed;function sceneTexture(){rain.setBackground('../../public/assets/r8/app-background-'+(q('#view').classList.contains('phone')||innerWidth<=760?'mobile':'desktop')+'.png')}sceneTexture();
function message(s){q('#message').textContent=s}function save(){try{localStorage.setItem('now.rain.r9.4.f1',JSON.stringify(config))}catch{}q('#opening').href='index.html?manual=1&seed='+rain.seed+'&rainConfig='+encodeURIComponent(JSON.stringify(config))}
function set(k,v){config=GlassRain.validate({...config,[k]:v});rain.update(config);sync();save();q('.selected')?.classList.remove('selected')}
for(const[k,label,min,max,step,unit]of fields){const el=document.createElement('div');el.className='field';el.innerHTML='<label for="'+k+'">'+label+'<span class="value"><input id="'+k+'-number" aria-label="'+label+'数值" type="number" min="'+min+'" max="'+max+'" step="'+step+'"><span>'+unit+'</span></span></label><input id="'+k+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" aria-label="'+label+'">';q('#controls').append(el);q('#'+k).oninput=e=>set(k,+e.target.value);q('#'+k+'-number').oninput=e=>{if(e.target.value!==''&&e.target.checkValidity())set(k,+e.target.value)};q('#'+k+'-number').onchange=e=>set(k,+e.target.value)}
function sync(){for(const[k]of fields){q('#'+k).value=config[k];q('#'+k+'-number').value=config[k]}q('#protect').checked=config.protectBrand}
sync();save();
q('.selected')?.classList.remove('selected');for(const [key,preset]of Object.entries(presets)){if(JSON.stringify(config)===JSON.stringify(preset))q('[data-preset="'+key+'"]').classList.add('selected')}
const reduced=matchMedia('(prefers-reduced-motion:reduce)').matches;if(reduced){rain.seek(3000);q('#pause').textContent='播放雨景';message('遵循减少动态效果设置，已暂停；你可以主动播放。')}else rain.start();
q('#pause').onclick=()=>{if(rain.running)rain.pause();else rain.start();q('#pause').textContent=rain.running?'暂停雨景':'播放雨景'};
q('#random').onclick=()=>{rain.reset();q('#seed').value=rain.seed;save();message('已换一场雨；雨点与路径重新随机。')};
q('#clear').onclick=()=>{rain.reset(rain.seed);message('玻璃已清空，雨势继续。')};
q('#device').onclick=()=>{const phone=q('#view').classList.toggle('phone');q('#device').textContent=phone?'桌面构图':'手机构图';rain.reset(rain.seed);sceneTexture();message('切换画布尺寸，重新生成此场雨。')};
q('#protect').onchange=e=>set('protectBrand',e.target.checked);q('#show-brand').onchange=e=>q('#brand').hidden=!e.target.checked;
function applyPreset(key){config={...presets[key]};rain.update(config);sync();save();q('.selected')?.classList.remove('selected');q('[data-preset="'+key+'"]').classList.add('selected');message('已应用预设；新雨点使用新参数，旧水痕自然消退。')}
q('#reset').onclick=()=>applyPreset('confirmed');document.querySelectorAll('[data-preset]').forEach(b=>b.onclick=()=>applyPreset(b.dataset.preset));
q('#reproduce').onclick=()=>{rain.reset(Number(q('#seed').value)>>>0);q('#seed').value=rain.seed;save();message('从头重播同一随机样本。')};
const payload=()=>JSON.stringify({version:'R9.4-F1',seed:rain.seed,showBrand:q('#show-brand').checked,config},null,2);
q('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(payload());message('已复制 JSON 参数，可以交付前端。')}catch{message('浏览器未允许复制，请使用下载 JSON。')}};
q('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([payload()],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='now-rain-r9.4-'+rain.seed+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message('已导出参数与随机样本编号。')};
const statsTimer=setInterval(()=>{const s=rain.stats;q('#stats').textContent=(rain.running?'持续播放':'已暂停')+' · '+s.active+' 个雨点 / '+s.sliding+' 个正在滑落 · '+Math.floor(s.time)+'s'},400);
addEventListener('pagehide',()=>{clearInterval(statsTimer);rain.dispose()});
})();
</script></body></html>
