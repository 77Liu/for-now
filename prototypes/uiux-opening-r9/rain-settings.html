<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>此刻 · 开屏与氛围设置原型</title><link rel="stylesheet" href="rain-ui.css"><style>
.report-bar{min-height:35px;background:#e9efdf;color:#6e805f;padding:5px 22px;display:flex;align-items:center;gap:15px;font-size:11px;flex-wrap:wrap}.report-bar select{border:1px solid #c6d4b8;border-radius:5px;background:#fbfcf7;color:#527348;font-size:11px;padding:3px 7px}.report-bar label{display:flex;align-items:center;gap:5px}.report-bar a{color:#527348;margin-left:auto}.report-bar input{accent-color:#6e9255}header button{background:transparent;border:0;padding:5px 8px;font-size:13px}header{height:63px}main{height:calc(100dvh - 98px)}.panel{padding-bottom:0;display:flex;flex-direction:column}.scroll-panel{overflow:auto;flex:1;margin:0 -22px;padding:0 22px 20px}.panel h2{font-size:24px}.lead{color:#718269;font-size:12px;margin:7px 0 20px}.switch-row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:43px;border-bottom:1px solid #dce4d4;margin:0 0 20px;padding-bottom:15px}.switch-row input{appearance:none;width:39px;height:23px;border-radius:15px;background:#ced8c5;position:relative;cursor:pointer;margin:0}.switch-row input:checked{background:#6f9357}.switch-row input:before{content:'';position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #52634624;transition:left .1s}.switch-row input:checked:before{left:19px}fieldset{border:0;margin:0;padding:0;min-width:0}fieldset:disabled{opacity:.45}details.parameters{border-top:1px solid #dce4d4;margin-top:14px;padding-top:10px}details.parameters summary{font-size:13px;min-height:41px;display:list-item}details.parameters[open] summary{margin-bottom:5px}.field{margin-bottom:14px}.footer-save{position:sticky;bottom:0;background:#fafbf6;border-top:1px solid #dce4d4;padding:12px 0 17px}.footer-save p{margin:0 0 8px;font-size:11px;color:#7a8b6f}.actions{display:flex;gap:8px}.actions button{flex:1}.actions button:disabled{opacity:.46;cursor:default}.error{color:#96634c!important}#dirty{min-height:18px}.preview-description{font-size:12px;color:#6f8164;flex:1}.brand{z-index:1}.corner{font-size:10px}.view-bar{gap:10px}#list{max-width:740px;margin:52px auto;padding:0 24px}#list h1{font-size:32px;margin-bottom:24px}.profile{padding:23px 0;margin-bottom:19px;border-bottom:1px solid #d6dfcb}.profile b{font:23px 'Songti SC',serif}.profile p{font-size:12px;color:#7a8872;margin:7px 0}.setting-row{width:100%;padding:20px 0;display:flex;align-items:center;justify-content:space-between;background:none;border:0;border-bottom:1px solid #d6dfcb;border-radius:0;text-align:left}.setting-row:hover{background:#edf3e644}.setting-row strong{font-size:15px;font-weight:500}.setting-row p{font-size:12px;color:#7a8872;margin:4px 0 0}.setting-row span{color:#6e805d;font-size:12px}.info-note{font-size:12px;color:#76876c;margin-top:30px;line-height:1.9}dialog{width:min(430px,calc(100% - 30px));border:1px solid #ccd8bd;border-radius:15px;background:#fbfcf7;padding:25px;color:#3c5533;box-shadow:0 15px 75px #3c583522}dialog::backdrop{background:#31432b44;backdrop-filter:blur(3px)}dialog h2{font:25px 'Songti SC',serif;margin:0 0 10px}dialog p{font-size:13px;color:#7a8872;margin-bottom:22px}dialog .actions{flex-wrap:wrap}dialog button{font-size:12px}dialog .actions button{flex:1;min-width:105px}#default-info{padding:20px 0;color:#728766}.subtle{border:0;background:none;text-decoration:underline;text-underline-offset:4px;padding-left:0;padding-right:0;color:#718468;font-size:12px}#main-label{font-size:11px;color:#7e8d72}.ordinary #main-label{display:none}@media(max-width:760px){.report-bar{padding:6px 12px;gap:8px}.report-bar a{margin-left:0}main{height:auto}.view{height:57dvh;min-height:360px}.panel{padding:23px 20px 0;overflow:visible}.scroll-panel{overflow:visible;margin:0;padding:0}.footer-save{position:fixed;bottom:0;left:0;right:0;z-index:5;padding:10px 20px 16px;background:#fafbf6f5;backdrop-filter:blur(8px)}.panel{padding-bottom:110px}.controls-grid{display:block}.view-bar{display:block}.view-bar button{margin-right:8px;margin-bottom:5px}.preview-description{display:block;font-size:11px}#list{margin-top:30px}header{padding:12px 14px}h1{font-size:22px}header div{gap:8px}}
</style></head><body><div class="report-bar"><span>交互原型 · 仅本机保存，未接入账户服务</span><select id="role" aria-label="原型账户视角"><option value="main">主账户视角</option><option value="ordinary">普通账户视角</option></select><label><input id="save-error" type="checkbox">演示保存失败</label><a href="rain-lab.html">全部参数调色室 →</a></div><header id="editor-header"><div><button id="back">‹ 设置</button><h1>开屏与氛围</h1></div><span id="main-label">我的偏好</span></header><section id="list" hidden><h1>设置</h1><div class="profile"><b>我的账户</b><p>让此刻更合自己的心意。</p></div><button class="setting-row" id="open-editor"><div><strong>开屏与氛围</strong><p>雨势、水珠与山水显影</p></div><span id="row-summary">开启 ›</span></button><p class="info-note" id="ordinary-note" hidden>外观沿用此刻默认设置。</p></section><main id="editor"><section class="view"><div class="canvas-wrap"><div class="landscape"></div><div class="glass"></div><img class="bamboo" src="../uiux-current-polish-r8/assets/bamboo-edge.png" alt=""><div class="brand">此刻<span>此</span></div><canvas id="rain" aria-label="当前设置的连续雨景预览"></canvas><span class="corner">雨在窗前，思绪在此。</span></div><div class="view-bar"><button id="pause">暂停预览</button><button id="new-rain">换一场雨</button><a class="button" href="index.html?delay=900&amp;demoSettings=1" target="_blank">试看已保存的开屏 ↗</a><span class="preview-description">此处持续预览；实际打开时，页面就绪即进入。</span></div></section><aside class="panel"><div class="scroll-panel"><h2>窗前的雨</h2><p class="lead">浅绿、轻盈，留一点自然的动静。</p><label class="switch-row"><span>开屏动画</span><input id="enabled" aria-label="开屏动画" type="checkbox" role="switch" checked></label><p id="off-note" class="help" hidden>已关闭动态效果；打开时保留静态品牌，页面就绪即进入。</p><fieldset id="parameters"><div id="basic"></div><details class="parameters"><summary>更多雨景参数</summary><div id="advanced"></div><label class="check"><input id="protect" type="checkbox">让滑落水珠避开品牌中央</label><p class="help">系统开启“减少动态效果”时，开屏保持静态。这里的预览可以主动播放。</p></details></fieldset><button id="defaults" class="subtle">恢复默认参数</button></div><div class="footer-save"><p id="dirty" role="status">已保存</p><div class="actions"><button id="cancel" disabled>取消修改</button><button id="save" class="primary" disabled>保存设置</button></div></div></aside></main><dialog id="leave"><h2>保留这次调整？</h2><p>你还没有保存新的雨景参数。</p><div class="actions"><button id="stay">继续调整</button><button id="discard">放弃修改</button><button id="save-leave" class="primary">保存并返回</button></div></dialog><script src="rain-engine.js"></script><script>
(()=>{'use strict';const q=s=>document.querySelector(s),key='now.opening.settings.demo.main.f1';
const fields=[['density','雨水密度',0,10,.1,'滴/s'],['trailPercent','产生拖尾',0,100,1,'%'],['dropSize','水珠大小',2,14,.5,'px'],['trailWidth','湿痕宽度',2,22,.5,'px'],['speed','滑落速度',15,180,1,'px/s'],['slideDelay','撞击后起滑',0,250,5,'ms'],['slideLength','滑落距离',60,400,5,'px'],['bend','路径偏折',0,100,1,'%'],['splash','飞溅小珠',0,10,1,'颗'],['trailLife','湿痕保留',1,18,.5,'s'],['beadLife','停留珠寿命',2,25,.5,'s'],['contrast','折光强度',20,140,1,'%']];
const fresh=()=>({enabled:true,config:{...GlassRain.defaults}});let saved=fresh();try{const v=JSON.parse(localStorage.getItem(key));if(v)saved={enabled:v.enabled!==false,config:GlassRain.validate(v.config)}}catch{}
let draft=structuredClone(saved),paused=matchMedia('(prefers-reduced-motion:reduce)').matches,saving=false,main=true,error='';const rain=new GlassRain(q('#rain'),draft.config);rain.setBackground('../uiux-current-polish-r8/assets/app-background-'+(innerWidth<=760?'mobile':'desktop')+'.png');
const isDirty=()=>JSON.stringify(draft)!==JSON.stringify(saved);
for(const[k,label,min,max,step,unit]of fields){const el=document.createElement('div');el.className='field';el.innerHTML='<label for="'+k+'">'+label+'<span class="value"><input id="'+k+'-number" type="number" min="'+min+'" max="'+max+'" step="'+step+'" aria-label="'+label+'数值"><span>'+unit+'</span></span></label><input id="'+k+'" type="range" min="'+min+'" max="'+max+'" step="'+step+'" aria-label="'+label+'">';q(k==='density'||k==='trailPercent'?'#basic':'#advanced').append(el);q('#'+k).oninput=e=>change(k,+e.target.value);q('#'+k+'-number').oninput=e=>{if(e.target.value!==''&&e.target.checkValidity())change(k,+e.target.value)};q('#'+k+'-number').onchange=e=>change(k,+e.target.value)}
function sync(){for(const[k]of fields){q('#'+k).value=draft.config[k];q('#'+k+'-number').value=draft.config[k]}q('#protect').checked=draft.config.protectBrand;q('#enabled').checked=draft.enabled;q('#parameters').disabled=!draft.enabled||saving||!main;q('#off-note').hidden=draft.enabled;q('#save').disabled=q('#cancel').disabled=!isDirty()||saving||!main;q('#enabled').disabled=q('#defaults').disabled=saving||!main;q('#dirty').textContent=error||(saving?'正在保存…':isDirty()?'有未保存的调整':'已保存');q('#dirty').classList.toggle('error',!!error);q('#save').textContent=saving?'保存中…':'保存设置';q('#row-summary').textContent=saved.enabled?'开启 ›':'关闭 ›';q('#pause').disabled=q('#new-rain').disabled=!draft.enabled;q('#pause').textContent=paused?'播放预览':'暂停预览'}
function preview(){rain.update(draft.config);if(!draft.enabled){rain.pause();rain.reset(rain.seed)}else if(!paused)rain.start();else rain.pause()}
function change(k,v){if(!main||saving)return;draft.config=GlassRain.validate({...draft.config,[k]:v});error='';sync();preview()}
q('#protect').onchange=e=>change('protectBrand',e.target.checked);q('#enabled').onchange=e=>{if(!main||saving)return;draft.enabled=e.target.checked;error='';sync();preview()};
q('#defaults').onclick=()=>{draft=fresh();error='';sync();preview()};q('#cancel').onclick=()=>{draft=structuredClone(saved);error='';sync();rain.reset(rain.seed);preview()};
q('#pause').onclick=()=>{paused=!paused;preview();sync()};q('#new-rain').onclick=()=>rain.reset();
async function save(exit=false){if(!main||saving)return;saving=true;error='';sync();await new Promise(r=>setTimeout(r,180));if(!main){saving=false;sync();return}try{if(q('#save-error').checked)throw new Error('demo');localStorage.setItem(key,JSON.stringify(draft));saved=structuredClone(draft);error='';saving=false;sync();if(exit){q('#leave').close();showList()}}catch{saving=false;error='保存没有成功，调整仍保留，可以重试。';sync();if(q('#leave').open)q('#leave').close()}}
q('#save').onclick=()=>save();function showList(){q('#editor').hidden=q('#editor-header').hidden=true;q('#list').hidden=false;rain.pause()}
function showEditor(){if(!main)return;draft=structuredClone(saved);error='';q('#editor').hidden=q('#editor-header').hidden=false;q('#list').hidden=true;rain.reset();sync();preview()}
q('#back').onclick=()=>{if(saving)return;if(isDirty())q('#leave').showModal();else showList()};q('#open-editor').onclick=showEditor;q('#stay').onclick=()=>q('#leave').close();q('#discard').onclick=()=>{draft=structuredClone(saved);q('#leave').close();sync();showList()};q('#save-leave').onclick=()=>save(true);
q('#role').onchange=e=>{main=e.target.value==='main';document.body.classList.toggle('ordinary',!main);q('#open-editor').hidden=!main;q('#ordinary-note').hidden=main;draft=structuredClone(saved);error='';if(q('#leave').open)q('#leave').close();showList();sync()};
sync();preview();addEventListener('pagehide',()=>rain.dispose());
})();
</script></body></html>
