<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#faf9f5">
  <title>此刻 · 首页 v0.2 原型</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <svg class="icon-library" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
    <symbol id="i-leaf" viewBox="0 0 24 24"><path d="M5 19C2 10 9 4 21 3c-1 12-7 18-16 16Zm0 0L17 7M3 22l2-3"/></symbol>
    <symbol id="i-eye" viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></symbol>
    <symbol id="i-page" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h4"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2Z"/></symbol>
    <symbol id="i-pen" viewBox="0 0 24 24"><path d="m15 4 5 5M3 21l2-7L17 2l5 5-12 12-7 2Z"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M3 12h17m-6-6 6 6-6 6"/></symbol>
    <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M20 9a8 8 0 0 0-14-4L3 8m0-5v5h5M4 15a8 8 0 0 0 14 4l3-3m0 5v-5h-5"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
  </svg>
  <a class="skip-link" href="#main">跳到内容</a>
  <aside class="rail">
    <a class="brand" href="./index.html" aria-label="此刻首页">此刻<span class="seal" aria-hidden="true">此<br>刻</span></a>
    <nav class="primary-nav" aria-label="主导航">
      <button class="nav-item active" data-route="today" aria-current="page"><svg><use href="#i-leaf"/></svg><span>今日</span></button>
      <button class="nav-item" data-route="seen"><svg><use href="#i-eye"/></svg><span>所见</span></button>
      <button class="nav-item" data-route="thought"><svg><use href="#i-page"/></svg><span>所思</span></button>
      <button class="nav-item" data-route="mine"><svg><use href="#i-user"/></svg><span>我的</span></button>
    </nav>
    <a class="prototype-link" href="guide.html">原型说明 · v0.2</a>
  </aside>
  <main id="main" tabindex="-1">
    <header class="topbar">
      <a class="brand mobile-brand" href="./index.html">此刻<span class="seal" aria-hidden="true">此<br>刻</span></a>
      <nav class="secondary-nav" aria-label="今日组内导航">
        <button class="selected" aria-current="page" data-route="today">此刻</button>
        <button data-route="together">共参</button>
        <button data-route="daily">每日</button>
      </nav>
      <time class="today-date" id="today-date"></time>
    </header>
    <section class="home" aria-label="此刻首页">
      <div class="actions-row">
        <button class="thought-action" id="new-thought"><svg><use href="#i-pen"/></svg><span>＋ 记录思考</span></button>
        <button class="text-action shuffle" id="shuffle"><svg><use href="#i-shuffle"/></svg>换一组</button>
      </div>
      <div class="editorial" id="content" aria-label="已有内容片段"></div>
      <p class="sr-only" role="status" id="content-status"></p>
      <div class="lower-row">
        <div class="keepsake">
          <button class="ticket" data-route="keepsakes" aria-label="打开小物，查看山间一花">
            <svg viewBox="0 0 70 115" aria-hidden="true" class="botanical"><path d="M30 105C39 74 34 45 49 13M34 76 15 53M38 56 59 37M42 38 27 20"/><path class="petal" d="M35 78C17 76 10 69 11 59c13 0 23 6 24 19ZM39 59c1-16 10-25 23-25-1 14-10 24-23 25ZM41 42C27 38 22 27 26 18c12 5 16 12 15 24ZM47 24c-3-13 0-18 8-21 4 9 1 16-8 21Z"/></svg>
            <span class="ticket-title">山间一花</span><span class="ticket-seal" aria-hidden="true">藏</span>
          </button>
          <button class="keepsake-action" data-route="keepsakes">小物<svg><use href="#i-arrow"/></svg></button>
        </div>
        <div class="state-reference" aria-label="情绪参考">
          <div class="sparkline-wrap"><span class="state-caption">情绪 · 近7天</span><svg id="sparkline" viewBox="0 0 270 54" role="img" aria-label="近7天情绪记录参考，可打开趋势查看具体数值"></svg></div>
          <div class="state-actions"><button class="text-action" id="record-state">记录状态</button><button class="text-action" id="view-trend">查看趋势<svg><use href="#i-arrow"/></svg></button></div>
        </div>
      </div>
    </section>
    <footer class="demo-note">v0.2 交互原型 · 示例内容 <a href="guide.html">开发说明</a></footer>
  </main>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <div class="dialog-heading"><h1 id="dialog-title"></h1><button class="icon-button" id="close-dialog" aria-label="关闭"><svg><use href="#i-close"/></svg></button></div>
    <div id="dialog-content"></div>
  </dialog>
  <div class="toast" role="status" id="toast" hidden></div>
</body>
</html>
