# Include these locations in both the port-80 and port-443 server blocks.
# The current root application remains unchanged.
location = /apps {
    return 308 /apps/;
}

location = /apps/ {
    root /var/www/app-portal;
    try_files /index.html =404;
}

location = /now {
    return 308 https://$host/now/;
}

# This service-to-service endpoint is intentionally unavailable through Nginx.
location = /now/api/admin/v1/snapshot {
    return 404;
}

# Public text assets are precompressed once while building the release.
location ~ ^/now/(?<static_text>(?:app|service-worker)\.js|drift\.css|manifest\.webmanifest|(?:frontend|vendor)/(?:[A-Za-z0-9._-]+/)*[A-Za-z0-9._-]+\.(?:css|js|mjs))$ {
    if ($scheme = http) {
        return 308 https://$host$request_uri;
    }

    alias /opt/for-now/app/public/$static_text;
    types {
        text/css css;
        application/javascript js mjs;
        application/manifest+json webmanifest;
    }
    gzip_static on;
    add_header Cache-Control "no-store" always;
    add_header Vary "Accept-Encoding" always;
}

location /now/ {
    if ($scheme = http) {
        return 308 https://$host$request_uri;
    }

    client_max_body_size 36m;
    # The proxied HTML and JSON remain no-store; level 2 bounds per-request CPU.
    gzip on;
    gzip_comp_level 2;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/problem+json;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    proxy_pass http://127.0.0.1:4173;
}

location = /platform {
    return 308 https://$host/platform/;
}

location /platform/ {
    if ($scheme = http) {
        return 308 https://$host$request_uri;
    }

    client_max_body_size 100k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_pass http://127.0.0.1:4280/;
}
