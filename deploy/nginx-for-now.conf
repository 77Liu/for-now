# Include these locations in both the port-80 and port-443 server blocks.
# The current root application remains unchanged.
location = /apps {
    return 308 /apps/;
}

location = /apps/ {
    root /var/www/app-portal;
    try_files /index.html =404;
}

location = /now {
    return 308 https://$host/now/;
}

# This service-to-service endpoint is intentionally unavailable through Nginx.
location = /now/api/admin/v1/snapshot {
    return 404;
}

location /now/ {
    if ($scheme = http) {
        return 308 https://$host$request_uri;
    }

    client_max_body_size 36m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    proxy_pass http://127.0.0.1:4173/;
}

location = /platform {
    return 308 https://$host/platform/;
}

location /platform/ {
    if ($scheme = http) {
        return 308 https://$host$request_uri;
    }

    client_max_body_size 100k;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 20s;
    proxy_send_timeout 20s;
    proxy_pass http://127.0.0.1:4280/;
}
