# Included only by the 77liu.top HTTPS server.
location = /preview {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 308 /preview/;
}

# Never expose the loopback-only platform snapshot through Preview.
location = /preview/api/admin/v1/snapshot {
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    return 404;
}

# Text assets are compressed once while building the immutable release.
location ~ ^/preview/(?<preview_static_text>(?:(?:app|service-worker)\.js|(?:drift|styles)\.css|manifest\.webmanifest|(?:frontend|vendor)/(?:[A-Za-z0-9._-]+/)*[A-Za-z0-9._-]+\.(?:css|js|mjs|svg|webmanifest)))$ {
    alias /opt/for-now-preview/app/public/$preview_static_text;
    gzip_static on;
    add_header Cache-Control "no-store" always;
    add_header Vary "Accept-Encoding" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}

location /preview/ {
    client_max_body_size 36m;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 310s;
    proxy_send_timeout 310s;
    proxy_pass http://127.0.0.1:4175;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
}
