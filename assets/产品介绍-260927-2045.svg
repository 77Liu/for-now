<text x="1032" y="700" fill="#29312f" font-size="29" font-weight="600">下一轮要证明的事</text>
<text x="1019" y="743" fill="#707a76" font-size="24" font-weight="400">用户是否反复回来：7 日记录覆盖 + 周留存（待补）</text>
