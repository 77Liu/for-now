<text x="755" y="363" fill="#29312f" font-size="30" font-weight="600">低负担留下</text>
<text x="710" y="418" fill="#707a76" font-size="24" font-weight="400">状态与健康、捕念与日记</text>
<text x="710" y="461" fill="#707a76" font-size="24" font-weight="400">书摘、善言与小物</text>
<text x="1120" y="363" fill="#a77d35" font-size="32" font-weight="600" font-family="Songti SC, STSong, serif">二</text>
<text x="1165" y="363" fill="#29312f" font-size="30" font-weight="600">带着上下文想</text>
<text x="1120" y="418" fill="#707a76" font-size="24" font-weight="400">共参、思考追问、日记回望</text>
<text x="1120" y="461" fill="#707a76" font-size="24" font-weight="400">在具体原文上调用 @神鸡</text>
