<text x="88" y="454" fill="#707a76" font-size="26" font-weight="400">却把生活散落在日记、笔记与对话里。</text>
<text x="88" y="499" fill="#707a76" font-size="26" font-weight="400">下次提问，又要重新解释自己。</text>
