<text x="396" y="1180" fill="#707a76" font-size="23" font-weight="400">让好句子再相逢</text>
<rect x="663" y="1037" width="280" height="213" rx="8" fill="#f8faf9" stroke="#d9dfdc"/>
<text x="681" y="1084" fill="#29312f" font-size="30" font-weight="600" font-family="Songti SC, STSong, serif">小物</text>
<text x="681" y="1138" fill="#707a76" font-size="23" font-weight="400">原图与透明轮廓</text>
<text x="681" y="1180" fill="#707a76" font-size="23" font-weight="400">保存物件的故事</text>
<text x="1020" y="849" fill="#987665" font-size="22" font-weight="600">日记 · 回顾</text>
<text x="1020" y="903" fill="#29312f" font-size="37" font-weight="600" font-family="Songti SC, STSong, serif">过些时候，再看看走过的自己。</text>
<text x="1020" y="952" fill="#707a76" font-size="25" font-weight="400">日记先保留你的原话，需要时再请 AI 回望。</text>
<text x="1020" y="992" fill="#707a76" font-size="25" font-weight="400">从身体状态与思考轨迹中寻找线索，不急着下结论。</text>
<rect x="1025" y="1037" width="882" height="213" rx="8" fill="#f8faf9" stroke="#d9dfdc"/>
<text x="1047" y="1079" fill="#987665" font-size="22" font-weight="600">不必等到记录很多，才开始回看</text>
<text x="1047" y="1130" fill="#29312f" font-size="26" font-weight="400">记录少时，先看到初步观察与还缺什么。</text>
<text x="1047" y="1174" fill="#29312f" font-size="26" font-weight="400">有新发现，也能继续编辑、补充和纠正。</text>
<text x="1047" y="1220" fill="#47675f" font-size="25" font-weight="400">AI 的理解可以改变，你的原文不会被悄悄改写。</text>
<text x="64" y="1386" fill="#47675f" font-size="32" font-weight="400" font-family="Songti SC, STSong, serif">从今天的一点感受开始。记录不需要完整，答案也不必一次就对。</text>
