<text x="111" y="1138" fill="#707a76" font-size="23" font-weight="400">书摘与自己的思考</text>
<text x="111" y="1180" fill="#707a76" font-size="23" font-weight="400">随机回看笔记</text>
<rect x="378" y="1037" width="270" height="213" rx="8" fill="#f8faf9" stroke="#d9dfdc"/>
