<rect x="64" y="120" width="4" height="105" rx="0" fill="#47675f" stroke="#47675f"/>
<text x="88" y="167" fill="#29312f" font-size="51" font-weight="600" font-family="Songti SC, STSong, serif">把所见留下，把所思慢慢想清楚</text>
<text x="88" y="213" fill="#707a76" font-size="26" font-weight="400">此刻，陪你记下一天，也陪你重新看见自己。</text>
<rect x="64" y="270" width="908" height="509" rx="8" fill="#fcfdfc" stroke="#d9dfdc"/>
<rect x="996" y="270" width="940" height="509" rx="8" fill="#fcfdfc" stroke="#d9dfdc"/>
<text x="88" y="311" fill="#47675f" font-size="22" font-weight="600">念起 · 随手记下</text>
<text x="88" y="365" fill="#29312f" font-size="37" font-weight="600" font-family="Songti SC, STSong, serif">还没想清楚，也可以先留下。</text>
<text x="88" y="414" fill="#707a76" font-size="26" font-weight="400">一句突然冒出的念头，不必立刻变成完整的问题。</text>
<text x="88" y="454" fill="#707a76" font-size="26" font-weight="400">等你想继续时，再把它带进思考。</text>
<rect x="93" y="492" width="850" height="225" rx="8" fill="#f8faf9" stroke="#d9dfdc"/>
<text x="115" y="531" fill="#47675f" font-size="22" font-weight="600">一条捕念</text>
<text x="115" y="581" fill="#29312f" font-size="30" font-weight="400" font-family="Songti SC, STSong, serif">“我是不是总把忙碌，当作有进展？”</text>
<text x="115" y="626" fill="#707a76" font-size="23" font-weight="400"># 工作  # 自我观察</text>
<path d="M115 650 H919" fill="none" stroke="#47675f" stroke-width="2"/>
<text x="115" y="688" fill="#47675f" font-size="24" font-weight="400">留在念起</text>
<text x="750" y="688" fill="#47675f" font-size="24" font-weight="400">带入思考 →</text>
<text x="1020" y="311" fill="#667a88" font-size="22" font-weight="600">思绪 · 一起深究</text>
<text x="1020" y="365" fill="#29312f" font-size="37" font-weight="600" font-family="Songti SC, STSong, serif">一个回答，可以继续问下去。</text>
<text x="1020" y="414" fill="#707a76" font-size="26" font-weight="400">带着你的原始想法和已有追问继续讨论。</text>
<text x="1020" y="454" fill="#707a76" font-size="26" font-weight="400">哪里不认同，就划下来，和神鸡再想一层。</text>
<rect x="1025" y="492" width="882" height="225" rx="8" fill="#f8faf9" stroke="#d9dfdc"/>
<text x="1047" y="531" fill="#a77d35" font-size="22" font-weight="600">选中一句话 · @神鸡</text>
<rect x="1047" y="554" width="695" height="44" rx="4" fill="#e3eee7" stroke="#e3eee7"/>
<text x="1061" y="585" fill="#29312f" font-size="29" font-weight="400" font-family="Songti SC, STSong, serif">“做得更多，就代表做得更好吗？”</text>
<text x="1047" y="632" fill="#707a76" font-size="24" font-weight="400">可以检查前提、找反例，也可以补充自己的看法。</text>
<text x="1047" y="686" fill="#47675f" font-size="24" font-weight="400">你的批注和追问，会和这条思考一起留下。</text>
<rect x="64" y="807" width="908" height="509" rx="8" fill="#fcfdfc" stroke="#d9dfdc"/>
<rect x="996" y="807" width="940" height="509" rx="8" fill="#fcfdfc" stroke="#d9dfdc"/>
<text x="88" y="849" fill="#a77d35" font-size="22" font-weight="600">书间 · 拾句 · 小物</text>
<text x="88" y="903" fill="#29312f" font-size="37" font-weight="600" font-family="Songti SC, STSong, serif">读过的、遇见的，都有安放处。</text>
<text x="88" y="952" fill="#707a76" font-size="26" font-weight="400">记下阅读笔记，收藏一句话，留住一张小票。</text>
<text x="88" y="992" fill="#707a76" font-size="26" font-weight="400">它们可以带着日期、备注和你的感受再次出现。</text>
